[project]
name = "llama-omni-token2wav"
version = "0.0.0"
description = "Isolated dependency environment for the legacy Token2Wav Python service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.3.1",
    "torchaudio==2.3.1",
    "stepaudio2-minicpmo==0.1.1",
    "numpy~=1.26.4",
    "librosa==0.10.2.post1",
    "soundfile==0.12.1",
    "scipy==1.15.3",
    "diffusers==0.35.2",
    "HyperPyYAML==1.2.2",
    "s3tokenizer==0.2.0",
    "transformers==4.51.0",
    "onnxruntime==1.23.2",
]

[project.optional-dependencies]
# CI needs the old ABI and imports, not CUDA libraries or GPU model execution.
cpu = ["torch==2.3.1", "torchaudio==2.3.1"]

[dependency-groups]
ci = ["ty==0.0.84"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{index = "pytorch", extra = "cpu", marker = "sys_platform != 'darwin'"}]
torchaudio = [{index = "pytorch", extra = "cpu", marker = "sys_platform != 'darwin'"}]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["*.py"]
