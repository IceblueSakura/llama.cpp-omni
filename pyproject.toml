[project]
name = "llama-cpp-scripts"
description = "Scripts that ship with llama.cpp"
keywords = ["ggml", "gguf", "llama.cpp"]
version = "0.0.0"
readme = "README.md"
authors = [{name = "GGML", email = "ggml@ggml.ai"}]
requires-python = '>=3.12,<3.15'
dependencies = [
    'numpy>=1.26.4,<3.0.0',
    'sentencepiece>=0.1.98,<0.3.0',
    'transformers==5.5.1',
    'protobuf>=4.21.0,<5.0.0',
    'torch==2.11.0',
    'gguf>=0.19.0,<0.20.0',
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
homepage = "https://ggml.ai"
repository = "https://github.com/ggml-org/llama.cpp"

[project.scripts]
llama-convert-hf-to-gguf = "convert_hf_to_gguf:main"
llama-convert-lora-to-gguf = "convert_lora_to_gguf:main"
llama-convert-llama-ggml-to-gguf = "convert_llama_ggml_to_gguf:main"
llama-ggml-vk-generate-shaders = "ggml_vk_generate_shaders:main"

[dependency-groups]
# Native builds and script checks do not need the model-conversion ML stack.
ci = [
    'gguf>=0.19.0,<0.20.0',
    'numpy~=1.26.4',
    'jinja2==3.1.6',
    'pytest~=8.3.3',
    'ty==0.0.84',
    'flake8==7.4.1',
    'flake8-no-print==0.1.1',
]
# Mirrors the existing requirements-all environment; adds the missing APM dependency.
typecheck = [
    {include-group = 'ci'},
    'GitPython~=3.1.43',
    'PySide6~=6.9.0',
    'accelerate',
    'aiohttp~=3.9.3',
    'cffi~=1.16.0',
    'datasets~=3.2.0',
    'docstring_parser~=0.15',
    'huggingface_hub>=1.5.0,<2.0',
    'librosa>=0.10.2,<0.12',
    'matplotlib~=3.10.0',
    'openai~=2.14.0',
    'pandas~=2.2.3',
    'pillow~=11.3.0',
    'prometheus-client~=0.20.0',
    'pydantic~=2.11.7',
    'requests~=2.32.3',
    'seaborn~=0.13.2',
    'sentence-transformers',
    'tabulate~=0.9.0',
    'torchvision==0.26.0',
    'tqdm~=4.67.1',
    'typer~=0.24.1',
    'wget~=3.2',
]
publish = ['huggingface_hub>=1.5.0,<2.0', 'build>=1.3,<2']

[tool.poetry]
packages = [
    { include = "*.py", from = "." },
    { include = "conversion", from = "." },
]

[tool.uv]
default-groups = []
# The no-print plugin only uses the stable AST-plugin API, but its metadata pins
# Flake8 4.0.1 (broken on Python 3.12's importlib.metadata). Keep NP100 and its
# existing noqa annotations with a modern host; ci/test_python_env.py checks it.
override-dependencies = ['flake8==7.4.1']

[tool.uv.sources]
gguf = { path = "./gguf-py", editable = true }
torch = [{ index = "pytorch", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"
