name: Code Style Checker

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: model-naming-${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  model-naming:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check model naming conventions
        run: |
          python3 - << 'EOF'
          import re, os, sys

          pairs = re.findall(
              r'((?:case\s+LLM_ARCH_\w+\s*:\s*)+)return new (llama_model_\w+)\s*\(',
              open("src/llama-model.cpp").read())

          errors = []
          if not pairs:
              errors.append("No model factory mappings found; update this check if the factory changes")
          for cases, cls in pairs:
              # Shared implementations can have several adjacent case labels (e.g. MiniCPM4).
              arches = re.findall(r'LLM_ARCH_(\w+)', cases)
              suffix = next((name for name in arches if name.lower() == cls[len("llama_model_"):]), arches[0])
              arch = "/".join(f"LLM_ARCH_{name}" for name in arches)
              csuffix = cls[len("llama_model_"):]
              fname   = csuffix.replace("_", "-") + ".cpp"

              if any(not re.fullmatch(r'[A-Z][A-Z0-9_]*', name) for name in arches):
                  errors.append(f"{arch}: suffix not upper snake case, example: LLM_ARCH_MY_MODEL")

              if not re.fullmatch(r'[a-z][a-z0-9_]*', csuffix):
                  errors.append(f"{arch}: class suffix not lower snake case, example: llama_model_my_model")

              elif suffix.lower() != csuffix:
                  errors.append(f"{arch}: arch/class name mismatch, expected class 'llama_model_{suffix.lower()}' but got '{cls}'")

              elif not os.path.isfile(f"src/models/{fname}"):
                  errors.append(f"{arch}: expects model file name to be src/models/{fname}, but not found")

          if errors:
              print('\n'.join(f"  - {e}" for e in errors)); sys.exit(1)
          print(f"OK: {len(pairs)} mappings validated.")
          EOF
