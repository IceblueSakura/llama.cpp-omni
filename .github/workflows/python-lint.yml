name: flake8 Lint

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: python-lint-${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  flake8-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: Lint
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python
      - name: Lint with the locked Python 3.12 tools
        run: flake8 .
