# Apple toolchain conventions synced from ggml-org/llama.cpp
# ca2e2037b68ae7d821113d538110e6ce6903864c. macOS arm64 lives in tier-1 CI.
name: CI (tier-2 Apple)

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: Compatibility target (not a required PR check)
        options: [macos-intel, iOS, tvOS, visionOS]
        default: macos-intel

permissions:
  contents: read

concurrency:
  group: apple-${{ inputs.platform }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ${{ inputs.platform == 'macos-intel' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python
      - name: macOS Intel build and tests
        if: inputs.platform == 'macos-intel'
        run: |
          cmake -B build -DGGML_METAL=OFF -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF \
            -DLLAMA_BUILD_BORINGSSL=ON -DLLAMA_OPENSSL=OFF
          cmake --build build --parallel 4
          ctest --test-dir build -L 'main|python' -E '^test-llama-archs$' --output-on-failure --timeout 900 --no-tests=error
          python ci/smoke.py --bin-dir build/bin --tls
      - name: Apple SDK library build (no signing)
        if: inputs.platform != 'macos-intel'
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_SYSTEM_NAME="$PLATFORM" \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DLLAMA_OPENSSL=OFF -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF
          cmake --build build --config Release --parallel 4 -- CODE_SIGNING_ALLOWED=NO
