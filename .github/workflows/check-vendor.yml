name: Check vendor

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check-vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reproduce pinned snapshots and existing project patches (read-only)
        run: python scripts/sync_vendor.py --check
