name: Server smoke

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# The original llama-server and chat API suite are not this project's servers.
# Tier-1 CI already runs ci/smoke.py against every native build; this entry point
# also permits an explicit repeat of that complete build/test pipeline.
jobs:
  verify:
    uses: ./.github/workflows/build.yml
