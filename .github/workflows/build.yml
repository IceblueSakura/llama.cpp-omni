# Adapted from ggml-org/llama.cpp ca2e2037b68ae7d821113d538110e6ce6903864c.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:
    inputs:
      package:
        description: Build and smoke-test release archives
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python
      - name: Check CI scripts
        run: |
          python -m unittest discover -s ci -p 'test_*.py' -v
          python -m compileall -q ci
          ty check ci --python-version 3.12 --output-format github
          flake8 ci
      - name: Check workflows
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color -shellcheck= -pyflakes=

  ui:
    name: UI build
    uses: ./.github/workflows/ui-build.yml

  platforms:
    name: Tier 1
    needs: ui
    uses: ./.github/workflows/build-cpu.yml
    with:
      package: ${{ inputs.package || false }}

  ui-checks:
    name: UI checks
    uses: ./.github/workflows/ui.yml

  naming:
    name: Model naming
    uses: ./.github/workflows/code-style.yml

  formatting:
    name: EditorConfig
    uses: ./.github/workflows/editorconfig.yml

  vendor:
    name: Vendor snapshots
    uses: ./.github/workflows/check-vendor.yml

  cmake-package:
    name: CMake package
    uses: ./.github/workflows/build-cmake-pkg.yml

  python-lint:
    name: Python lint
    uses: ./.github/workflows/python-lint.yml

  python-types:
    name: Python types
    uses: ./.github/workflows/python-type-check.yml

  python-requirements:
    name: Python requirements compatibility
    uses: ./.github/workflows/python-check-requirements.yml

  ops-docs:
    name: Operations documentation
    uses: ./.github/workflows/update-ops-docs.yml

  required:
    name: Required checks
    if: ${{ always() }}
    needs:
      - workflows
      - ui
      - platforms
      - ui-checks
      - naming
      - formatting
      - vendor
      - cmake-package
      - python-lint
      - python-types
      - python-requirements
      - ops-docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all tier-1 checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed:
              raise SystemExit(f'Required checks did not pass: {failed}')
          print('All required checks passed')
          PY
