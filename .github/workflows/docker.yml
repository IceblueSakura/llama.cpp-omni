# Buildx/action pins synced from ggml-org/llama.cpp
# ca2e2037b68ae7d821113d538110e6ce6903864c; no automatic tag or registry writes.
name: Docker

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push the tested CPU server image to this repository's GHCR
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Require successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=20" --jq '.workflow_runs | length')
          if [ "$count" -eq 0 ]; then
            echo 'Run CI successfully for this commit before building/publishing the image' >&2
            exit 1
          fi

  image:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Build local image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: .devops/cpu.Dockerfile
          target: server
          load: true
          push: false
          tags: omni-ci:server
          build-args: |
            APP_REVISION=${{ github.sha }}
            IMAGE_URL=${{ github.server_url }}/${{ github.repository }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
      - name: Test image entry point and health
        run: |
          docker run --rm omni-ci:server --help
          docker run --name omni-smoke -d -p 127.0.0.1:18080:8080 omni-ci:server
          trap 'docker logs omni-smoke; docker rm -f omni-smoke' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health > health.json; then
              jq -e '.status == "ok" and .engine == "comni"' health.json
              exit 0
            fi
            sleep 1
          done
          exit 1
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: Push tested image
        if: inputs.push
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          docker tag omni-ci:server "$image:server-${GITHUB_SHA:0:7}"
          docker tag omni-ci:server "$image:server"
          docker push "$image:server-${GITHUB_SHA:0:7}"
          docker push "$image:server"
