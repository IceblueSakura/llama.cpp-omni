# Manual, same-commit verification adapted from ggml-org/llama.cpp's
# release.yml/make-release.yml at ca2e2037b68ae7d821113d538110e6ce6903864c.
name: Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Publish a GitHub release after verification (false = artifacts only)
        type: boolean
        default: false
      tag:
        description: Existing tag at this commit; required only when publishing
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/build.yml
    with:
      package: true

  publish:
    if: ${{ inputs.create_release }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo 'A valid existing release tag is required' >&2
            exit 1
          fi
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Download tested UI
        uses: actions/download-artifact@v7
        with:
          name: ui-build
          path: ui-dist
      - name: Package UI and checksums
        run: |
          tar -czf release/llama.cpp-omni-ui.tar.gz -C ui-dist .
          cd release
          sha256sum *.zip *.tar.gz > SHA256SUMS
      - name: Publish release to this repository
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "llama.cpp-omni $TAG" --generate-notes
