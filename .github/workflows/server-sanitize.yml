name: Server (sanitize)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ADDRESS, UNDEFINED]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python
      - name: Build supported servers
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF \
            -DLLAMA_BUILD_BORINGSSL=ON -DLLAMA_OPENSSL=OFF -DGGML_OPENMP=OFF \
            -DLLAMA_SANITIZE_${SANITIZER}=ON -DGGML_SANITIZE_${SANITIZER}=ON
          cmake --build build --parallel 4 --target llama-omni-server llama-tts-server llama-omni-cli voxcpm2-cli
      - name: Model-free protocol and lifecycle tests
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python ci/smoke.py --bin-dir build/bin --tls
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: server-sanitize-${{ matrix.sanitizer }}
          path: build/omni-smoke-logs/
          if-no-files-found: ignore
