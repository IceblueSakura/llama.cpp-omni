name: UI Publish

on:
  workflow_call:
    inputs:
      version_tag:
        description: Version of the already-built ui-build artifact
        required: true
        type: string
      hf_bucket:
        description: Explicit destination in owner/bucket form (no upstream default)
        required: true
        type: string
    secrets:
      hf_token:
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.hf_token }}
      HF_BUCKET: ${{ inputs.hf_bucket }}
      VERSION: ${{ inputs.version_tag }}
    steps:
      - name: Validate destination
        run: |
          [[ "$HF_BUCKET" =~ ^[A-Za-z0-9_-]+/[A-Za-z0-9._-]+$ ]]
          [[ "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: ui-build
          path: ui-dist/
      - uses: ./.github/actions/setup-python
        with:
          profile: publish
      - name: Upload existing artifact
        run: |
          hf buckets sync ui-dist "hf://buckets/${HF_BUCKET}/${VERSION}" --quiet
          hf buckets list "hf://buckets/${HF_BUCKET}/${VERSION}" -R
