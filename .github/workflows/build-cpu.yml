# CPU/toolchain/cache conventions synced from ggml-org/llama.cpp
# ca2e2037b68ae7d821113d538110e6ce6903864c; no upstream HF cache credentials.
name: CI (tier-1 platforms)

on:
  workflow_call:
    inputs:
      package:
        type: boolean
        default: false
      architecture_diagnostics:
        description: Run the full-architecture synthetic test outside the release gate
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            generator: Ninja
            bin_dir: build/bin
            rpath: '$ORIGIN'
            args: '-DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DGGML_METAL=OFF'
          - platform: macos-arm64
            os: macos-14
            generator: Ninja
            bin_dir: build/bin
            rpath: '@loader_path'
            args: '-DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DGGML_OPENMP=OFF'
          - platform: windows-x64
            os: windows-2025
            generator: Ninja Multi-Config
            bin_dir: build/bin/Release
            rpath: ''
            args: '-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DGGML_OPENMP=OFF -DBUILD_SHARED_LIBS=OFF'
    defaults:
      run:
        shell: bash
    env:
      GGML_NLOOP: 3
      GGML_N_THREADS: 1
      LLAMA_ARG_LOG_COLORS: 1
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 ninja-build
      - name: Windows compiler environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Compiler cache
        uses: ggml-org/ccache-action@v1.2.24
        with:
          key: omni-${{ matrix.platform }}
          variant: ccache
          evict-old-files: 1d
          save: ${{ github.event_name != 'pull_request' }}
      - name: Download UI
        uses: actions/download-artifact@v7
        with:
          name: ui-build
          path: tools/ui/dist
      - name: Configure
        run: |
          cmake -S . -B build -G '${{ matrix.generator }}' \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_BORINGSSL=ON \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_USE_PREBUILT_UI=OFF \
            -DCMAKE_INSTALL_RPATH='${{ matrix.rpath }}' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            ${{ matrix.args }}
      - name: Build
        id: build
        env:
          DIAGNOSTICS: ${{ inputs.architecture_diagnostics }}
        run: |
          if [ "$DIAGNOSTICS" = true ]; then
            cmake --build build --config Release --parallel 4 --target test-llama-archs
          else
            cmake --build build --config Release --parallel 4
          fi
      - name: Required CTest suite
        if: ${{ !inputs.architecture_diagnostics }}
        # Existing CPU mixed-precision/Meta-backend failures are diagnosed separately,
        # not reported as passing or silently swallowed with continue-on-error.
        run: ctest --test-dir build -C Release -L 'main|python' -E '^test-llama-archs$' --output-on-failure --timeout 900 --no-tests=error
      - name: Full-architecture diagnostics
        if: inputs.architecture_diagnostics
        run: ctest --test-dir build -C Release -R '^test-llama-archs$' --output-on-failure --timeout 900 --no-tests=error
      - name: Omni and TTS smoke tests (no model weights)
        if: ${{ !cancelled() && !inputs.architecture_diagnostics && steps.build.conclusion == 'success' }}
        run: python ci/smoke.py --bin-dir '${{ matrix.bin_dir }}' --tls
      - name: Package and test extracted binaries
        if: inputs.package
        run: |
          python ci/package.py --bin-dir '${{ matrix.bin_dir }}' --name "llama.cpp-omni-${{ matrix.platform }}-${GITHUB_SHA:0:7}"
          python ci/smoke.py --bin-dir build-ci-package --tls
      - name: Upload release archive
        if: inputs.package
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.platform }}
          path: dist/llama.cpp-omni-${{ matrix.platform }}-*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-logs-${{ matrix.platform }}
          path: |
            build/Testing/Temporary/
            build/omni-smoke-logs/
          if-no-files-found: ignore
          retention-days: 7
